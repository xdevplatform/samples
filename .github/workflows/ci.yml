name: Verify Samples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly check against latest published XDK packages (Mondays 09:00 UTC)
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  python:
    name: Python (xdk) & Catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install xdk from PyPI
        run: python -m pip install --upgrade pip xdk

      - name: Verify Python samples & api-index.json
        run: |
          python - <<'PY'
          import json
          import pathlib
          import py_compile
          import re
          from xdk import Client

          client = Client(bearer_token="test")
          py_files = sorted(pathlib.Path("python").rglob("*.py"))
          assert len(py_files) >= 80, f"Expected >=80 Python samples, found {len(py_files)}"

          bad_calls = []
          for f in py_files:
              py_compile.compile(str(f), doraise=True)
              src = f.read_text(encoding="utf-8")
              for m in re.finditer(r"\bclient\.([A-Za-z0-9_]+)\.([A-Za-z0-9_]+)\s*\(", src):
                  sub, meth = m.group(1), m.group(2)
                  sub_obj = getattr(client, sub, None)
                  if sub_obj is None or not callable(getattr(sub_obj, meth, None)):
                      bad_calls.append((str(f), sub, meth))

          if bad_calls:
              raise SystemExit(f"Unresolved xdk method calls: {bad_calls}")

          catalog = json.loads(pathlib.Path("api-index.json").read_text(encoding="utf-8"))
          missing_paths = []
          for ep in catalog.get("endpoints", []):
              for lang, rel_path in ep.get("files", {}).items():
                  if not pathlib.Path(rel_path).is_file():
                      missing_paths.append((ep.get("id"), lang, rel_path))

          if missing_paths:
              raise SystemExit(f"Missing files in api-index.json: {missing_paths}")

          print(f"Verified {len(py_files)} Python samples and {len(catalog.get('endpoints', []))} catalog endpoints.")
          PY

  javascript-typescript:
    name: JavaScript & TypeScript (@xdevplatform/xdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify JavaScript samples
        run: |
          cd javascript
          npm install --no-audit --no-fund
          find . -name "*.js" -not -path "./node_modules/*" -exec node --check {} +
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');
          const { Client } = require('@xdevplatform/xdk');
          const client = new Client({ bearerToken: 'test' });

          function walk(dir) {
            const out = [];
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ent.name === 'node_modules') continue;
              const full = path.join(dir, ent.name);
              if (ent.isDirectory()) out.push(...walk(full));
              else if (ent.name.endsWith('.js')) out.push(full);
            }
            return out;
          }

          const files = walk('.');
          const bad = [];
          for (const f of files) {
            const src = fs.readFileSync(f, 'utf8');
            const re = /client\.([A-Za-z0-9_]+)\.([A-Za-z0-9_]+)\s*\(/g;
            let m;
            while ((m = re.exec(src)) !== null) {
              const [, sub, meth] = m;
              if (!client[sub] || typeof client[sub][meth] !== 'function') {
                bad.push({ file: f, sub, meth });
              }
            }
          }
          if (bad.length > 0) {
            console.error('Unresolved @xdevplatform/xdk calls:', bad);
            process.exit(1);
          }
          console.log(`Verified ${files.length} JavaScript samples.`);
          JS

      - name: Type-check TypeScript samples (tsc --noEmit --strict)
        run: |
          cd typescript
          npm install --no-audit --no-fund
          npm run typecheck

  java:
    name: Java 17+ (com.x:xdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile Java samples
        run: |
          if curl -fsSI https://repo1.maven.org/maven2/com/x/xdk/maven-metadata.xml >/dev/null 2>&1; then
            mvn -B -f java/pom.xml compile
          else
            echo "::notice::com.x:xdk is awaiting initial Maven Central publication; running JDK 17 AST syntax check until com.x:xdk 0.1.0 is indexed on Central."
            python3 - <<'PY'
          import pathlib, subprocess, tempfile
          code = """
          import com.sun.source.util.JavacTask;
          import java.io.File;
          import java.nio.file.*;
          import java.util.*;
          import java.util.stream.*;
          import javax.tools.*;

          public class ParseCheck {
              public static void main(String[] args) throws Exception {
                  List<File> files;
                  try (Stream<Path> walk = Files.walk(Paths.get("java"))) {
                      files = walk.filter(p -> p.toString().endsWith(".java"))
                                  .map(Path::toFile)
                                  .collect(Collectors.toList());
                  }
                  if (files.size() < 80) {
                      throw new IllegalStateException("Expected >=80 Java files, found " + files.size());
                  }
                  JavaCompiler compiler = ToolProvider.getSystemJavaCompiler();
                  DiagnosticCollector<JavaFileObject> diagnostics = new DiagnosticCollector<>();
                  try (StandardJavaFileManager fm = compiler.getStandardFileManager(diagnostics, null, null)) {
                      Iterable<? extends JavaFileObject> units = fm.getJavaFileObjectsFromFiles(files);
                      JavacTask task = (JavacTask) compiler.getTask(
                          null, fm, diagnostics, List.of("--release", "17"), null, units);
                      task.parse();
                  }
                  long errors = diagnostics.getDiagnostics().stream()
                      .filter(d -> d.getKind() == Diagnostic.Kind.ERROR)
                      .peek(System.err::println)
                      .count();
                  System.out.println("Parsed " + files.size() + " Java files cleanly.");
                  if (errors > 0) System.exit(1);
              }
          }
          """
          with tempfile.TemporaryDirectory() as d:
              p = pathlib.Path(d) / "ParseCheck.java"
              p.write_text(code)
              subprocess.run(["java", str(p)], check=True)
          PY
          fi

  csharp:
    name: C# / .NET 8 (XDevPlatform.Xdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build C# samples
        run: |
          if curl -fsSI https://api.nuget.org/v3-flatcontainer/xdevplatform.xdk/index.json >/dev/null 2>&1; then
            dotnet build csharp/XdkSamples.csproj -warnaserror
            dotnet run --project csharp/XdkSamples.csproj --no-build -- --help >/dev/null
          else
            echo "::notice::XDevPlatform.Xdk is awaiting initial NuGet.org publication; running Roslyn C# AST check until XDevPlatform.Xdk 0.1.0 is indexed on NuGet.org."
            python3 - <<'PY'
          import pathlib, subprocess, tempfile, textwrap
          csproj = """<Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.CodeAnalysis.CSharp" Version="4.8.0" />
            </ItemGroup>
          </Project>"""
          prog = textwrap.dedent("""\
          using Microsoft.CodeAnalysis;
          using Microsoft.CodeAnalysis.CSharp;

          var csFiles = Directory.EnumerateFiles(args[0], "*.cs", SearchOption.AllDirectories)
              .Where(p => !p.Contains($"{Path.DirectorySeparatorChar}bin{Path.DirectorySeparatorChar}")
                       && !p.Contains($"{Path.DirectorySeparatorChar}obj{Path.DirectorySeparatorChar}"))
              .OrderBy(p => p)
              .ToList();
          if (csFiles.Count < 81) throw new Exception($"Expected >=81 C# files, found {csFiles.Count}");
          var errors = 0;
          foreach (var f in csFiles)
          {
              var tree = CSharpSyntaxTree.ParseText(File.ReadAllText(f), path: f);
              foreach (var diag in tree.GetDiagnostics().Where(d => d.Severity == DiagnosticSeverity.Error))
              {
                  Console.Error.WriteLine(diag);
                  errors++;
              }
          }
          Console.WriteLine($"Parsed {csFiles.Count} C# files cleanly with Roslyn.");
          return errors > 0 ? 1 : 0;
          """)
          with tempfile.TemporaryDirectory() as d:
              dp = pathlib.Path(d)
              (dp / "Check.csproj").write_text(csproj)
              (dp / "Program.cs").write_text(prog)
              subprocess.run(["dotnet", "run", "--project", str(dp / "Check.csproj"), "--", "csharp"], check=True)
          PY
          fi
